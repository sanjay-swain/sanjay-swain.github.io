<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        /* --- Core Layout & Typography --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            color: #222;
            background-color: #fff;
        }

        /* --- Headers --- */
        h1,
        h2,
        h3,
        h4 {
            color: #111;
            font-weight: 600;
            margin-top: 1.8em;
            margin-bottom: 0.5em;
        }

        h1 {
            font-size: 2.2rem;
            border-bottom: 2px solid #eaecef;
            padding-bottom: 0.3em;
        }

        h2 {
            font-size: 1.6rem;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
        }

        h3 {
            font-size: 1.3rem;
        }

        /* --- Links --- */
        a {
            color: #0969da;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* --- Simple Navigation --- */
        nav {
            margin-bottom: 40px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaecef;
        }

        nav a {
            margin-right: 20px;
            font-weight: 500;
            color: #57606a;
        }

        nav a:hover {
            color: #0969da;
            text-decoration: none;
        }

        /* --- Code Blocks & Technical Syntax --- */
        code {
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 85%;
            background-color: #afb8c133;
            padding: 0.2em 0.4em;
            border-radius: 6px;
        }

        pre {
            background-color: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #d0d7de;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            font-size: 90%;
            color: #24292f;
        }

        /* --- Lists & Paragraphs --- */
        p,
        ul,
        ol {
            margin-bottom: 1.2em;
        }

        li {
            margin-bottom: 0.4em;
        }

        /* --- Blockquotes (Great for callouts or focus areas) --- */
        blockquote {
            margin: 1.5em 0;
            padding: 0 1em;
            color: #57606a;
            border-left: .25em solid #d0d7de;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
    </nav>

    <main>
        {{ content }}
    </main>

</body>

</html>
